name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          # Upstream targets API 37, which has no public platform package yet;
          # reuse the API 36 symbols under the android-37 path (same as local builds)
          cp -r "$ANDROID_HOME/platforms/android-36" "$ANDROID_HOME/platforms/android-37"

      - name: Build arm64 debug APK
        run: |
          chmod +x gradlew
          # Regenerate verification metadata so it stays complete on fresh
          # machines (artifacts already in a warm Gradle cache are not re-recorded)
          ./gradlew --write-verification-metadata=sha256 assembleDebug --no-daemon -x lint -x test

      - name: Commit refreshed verification metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh dependency verification metadata (CI)"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WizardCut-3.81.0-debug-arm64
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
